[workspace]
resolver = "2"
members = [
    "crates/rhizome-core",
    "crates/rhizome-etapi",
    "crates/rhizomed",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["knoff"]

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
html5ever = "0.39"
markup5ever_rcdom = "0.39"
marked-yaml = "0.8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rhizome-core = { path = "crates/rhizome-core" }
rhizome-etapi = { path = "crates/rhizome-etapi" }
