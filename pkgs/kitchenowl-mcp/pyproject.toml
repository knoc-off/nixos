[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kitchenowl-mcp"
version = "0.1.0"
description = "MCP server for a single KitchenOwl household, with recipe validation"
requires-python = ">=3.11"
dependencies = ["fastmcp", "httpx", "mcp", "uvicorn"]

[project.scripts]
kitchenowl-mcp = "kitchenowl_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kitchenowl_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
