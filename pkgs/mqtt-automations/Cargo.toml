[package]
name = "mqtt-automations"
version = "0.1.0"
edition = "2021"

[lib]
name = "mqtt_automations"
path = "src/lib.rs"

[[bin]]
name = "cat-doorbell"
path = "src/bin/cat_doorbell.rs"

[[bin]]
name = "lights"
path = "src/bin/lights.rs"

[dependencies]
rumqttc = { version = "0.24", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serialize"] }

[profile.release]
opt-level = 1
codegen-units = 16
