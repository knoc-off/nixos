[package]
name = "mqtt-automations"
version = "0.1.0"
edition = "2021"

[lib]
name = "mqtt_automations"
path = "src/lib.rs"

[[bin]]
name = "cat-doorbell"
path = "src/bin/cat_doorbell.rs"

[[bin]]
name = "sunrise-lights"
path = "src/bin/sunrise_lights.rs"

[[bin]]
name = "color-temp-cycle"
path = "src/bin/color_temp_cycle.rs"

[[bin]]
name = "bedtime-button"
path = "src/bin/bedtime_button.rs"

[[bin]]
name = "button-dispatcher"
path = "src/bin/button_dispatcher.rs"

[dependencies]
rumqttc = { version = "0.24", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 1
codegen-units = 16
