[workspace]
resolver = "2"
members = [
    "crates/marki-map",
    "crates/marki-media",
    "crates/marki-render",
    "crates/marki-typst",
    "crates/marki-anki",
    "crates/marki",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["knoff"]

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
globset = "0.4"
clap = { version = "4", features = ["derive", "env"] }
notify = "8"
notify-debouncer-full = "0.6"
pulldown-cmark = "0.13"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
syntect = { version = "5", default-features = false, features = ["default-fancy", "html"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ignore = "0.4"
indexmap = { version = "2", features = ["serde"] }
toml = { version = "0.9", features = ["preserve_order"] }
base64 = "0.22"
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled", "collation"] }
prost = "0.13"

# map renderer deps
shapefile = "0.6"

marki-map = { path = "crates/marki-map" }
marki-media = { path = "crates/marki-media" }
marki-render = { path = "crates/marki-render" }
marki-typst = { path = "crates/marki-typst" }
marki-anki = { path = "crates/marki-anki" }
